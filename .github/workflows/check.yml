name: Public kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -q
      - run: python tools/check_public.py --tracked --history
      - run: python tools/build_package.py --format workspace --output ./dist/qrclima-asistente-ci.zip
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npx --yes firebase-tools@15.0.0 --config test/emulator-config.json emulators:exec --only firestore,auth,storage --project demo-qrclima-assistant "node test/emulator.cjs"
        working-directory: server
